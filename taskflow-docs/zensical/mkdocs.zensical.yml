site_name: Документация Цифра.Карьер
site_url: https://docs.zyfra-mining.com/
watch:
- includes
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    admonition:
      question: fontawesome/solid/lightbulb
  custom_dir: ../data/overrides
  language: ru
  palette:
  - scheme: zyfra_light
    toggle:
      icon: material/toggle-switch
      name: Включить темное меню
  - scheme: zyfra_middle_dark
    toggle:
      icon: material/weather-night
      name: Включить темную тему
  - scheme: slate
    primary: black
    accent: green
    toggle:
      icon: material/weather-sunny
      name: Включить светлую тему
  features:
  - content.tooltips
  - content.footnote.tooltips
  - navigation.instant
  - navigation.instant.progress
  - navigation.instant.prefetch
  - navigation.instant.preview
  - navigation.top
  - navigation.path
  - navigation.tabs
  - navigation.tracking
  - navigation.footer
  - search.suggest
  - search.highlight
  - search.share
  - toc.follow
markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- footnotes
- tables
- toc:
    title: На этой странице
    slugify: !!python/name:markdown.extensions.toc.slugify_unicode
- pymdownx.mark
- pymdownx.caret
- pymdownx.tilde
- pymdownx.details
- pymdownx.superfences
- pymdownx.keys
- pymdownx.blocks.caption
- pymdownx.snippets:
    auto_append:
    - includes/abbreviations.md
- pymdownx.tabbed:
    alternate_style: true
extra_javascript:
- assets/javascripts/glightbox.min.js
extra_css:
- stylesheets/extra.css
- assets/stylesheets/glightbox.min.css
plugins:
- search
- autolinks
- glightbox:
    touchNavigation: true
    loop: true
    effect: zoom
    width: auto
    height: auto
    zoomable: true
    draggable: true
    auto_themed: false
    auto_caption: false
    caption_position: bottom
    background: white
    shadow: true
    manual: true
extra:
  generator: false
  analytics:
    provider: google
    feedback:
      title: Эта страница была вам полезна?
      ratings:
      - icon: material/thumb-up-outline
        name: Страница была полезна
        data: 1
        note: Спасибо за обратную связь!
      - icon: material/thumb-down-outline
        name: Эту страницу можно улучшить
        data: 0
        note: Помогите нам улучшить эту страницу. <a href="https://jira.zyfra.com/servicedesk/customer/portal/27/group/219">Написать
          в техническую поддержку</a>
