# Пример front matter для генерации PDF по ГОСТ (gost_pdf).
#
# Блок ставится в начало markdown-файла docs/*.md:
#
#     ---
#     <содержимое этого файла>
#     ---
#     # Первый H1 — наименование ПО (в тексте не выводится, идёт на титул)
#
# Ключи gost_* читаются из front matter; реквизиты попадают на титульный лист,
# в шапку/футер контентных страниц и в метаданные PDF. Все ключи необязательны:
# не заданный ключ берёт значение по умолчанию (см. комментарии).
# Полное соответствие «ключ → поле титула» — reference/РЕКВИЗИТЫ.md.

# --- Вид документа и реквизиты титульного листа ---

# Вид документа (по умолчанию — rukovodstvo-polzovatelya). Допускаются алиасы:
# «Техническое задание», «ТЗ», «Руководство программиста» и т. п.
# Определяет: вид на титуле, метаданные /Subject, обязательные разделы (см. низ),
# обязательность информационной части (аннотации).
gost_doc_type: rukovodstvo-polzovatelya

# Наименование ПО/изделия — крупно на титуле, метаданные /Title.
# По умолчанию — текст первого H1 markdown-файла.
gost_product_name: "Склад-5"

# Обозначение документа — титул и левая часть шапки контентных страниц.
# Формат: А.В.00001-01 ИИ 01-1 (ГОСТ 19.101-77, табл. 6). По умолчанию — "".
gost_oboznachenie: "А.В.00001-01 И3 01-1"

# Литера документа (титул, нижний колонтитул). По умолчанию — "".
gost_litera: "Э"

# Отметка учёта (титул). По умолчанию — "".
gost_otmetka_ucheta: "Экз. № 1"

# Строка сноски о внесении изменений — правая часть футера контентных страниц.
# По умолчанию — "" (футер пустой).
gost_stroka_izmenenij: "Внесены изменения в раздел «Описание операций»"

# Обозначение руководства пользователя (титул, для литеры «О»/дСП).
# По умолчанию — "".
gost_lu_oboznachenie: "А.В.00001-01 И3 01-2"

# Министерство/ведомство — строка над наименованием на титуле.
# По умолчанию — "" (строка не выводится).
gost_ministerstvo: "Минцифры России"

# Автор документа — метаданные PDF /Author.
# По умолчанию — автор последней версии из docs/release-notes.md.
gost_author: "Кудряшова Т.В."

# true → левое поле 30 мм вместо 20 мм (ГОСТ Р 7.0.97-2016, п. 6.1:
# документы со сроком хранения более 10 лет). По умолчанию — false.
gost_left_margin_30: false

# Аннотация — блок после титула и перед содержанием (ГОСТ Р 7.0.97-2016,
# п. 5.4). Обязательна, если у вида документа есть информационная часть
# (отмечено ниже «инф. часть»), иначе — необязательна.
# Пустая строка/отсутствие ключа → блок аннотации не выводится.
gost_annotation: |
  Справочник описывает назначение, состав и порядок работы с системой
  «Склад-5». Приведены правила создания задач, работа с проектами
  и отчётами, а также способы устранения типовых ошибок.

# --- Обязательные разделы (H2-заголовки тела файла) по видам документов ---
# Генератор предупреждает (WARNING в логе), если раздел из списка
# для выбранного gost_doc_type отсутствует. Названия сопоставляются
# без учёта регистра, по вхождению.

# Техническое задание [tz] — ГОСТ 19.201-78, п. 1.4
#   Введение; Основания для разработки; Назначение разработки;
#   Требования к программе или программному изделию;
#   Требования к программной документации; Технико-экономические показатели;
#   Стадии и этапы разработки; Порядок контроля и приемки

# Спецификация [spetsifikatsiya] — ГОСТ 19.202-78, п. 4
#   Документация; Комплексы; Компоненты

# Программа и методика испытаний [programma-ispytanij] — ГОСТ 19.301-79, п. 1.2
#   Объект испытаний; Цель испытаний; Требования к программе;
#   Требования к программной документации; Состав и порядок испытаний;
#   Методы испытаний

# Текст программы [tekst-programmy] — ГОСТ 19.401-78, п. 3–4
#   разделы стандартом не нормируются

# Описание программы [opisanie-programmy] — ГОСТ 19.402-78, п. 3, инф. часть
#   Общие сведения; Функциональное назначение; Описание логической структуры;
#   Используемые технические средства; Вызов и загрузка; Входные данные;
#   Выходные данные

# Пояснительная записка [poyasnitelnaya-zapiska] — ГОСТ 19.404-79, п. 1.2
#   Введение; Назначение и область применения; Технические характеристики;
#   Ожидаемые технико-экономические показатели;
#   Источники, использованные при разработке

# Описание применения [opisanie-primeneniya] — ГОСТ 19.502-78, п. 3, инф. часть
#   Назначение программы; Условия применения; Описание задачи;
#   Входные и выходные данные

# Руководство системного программиста [rukovodstvo-sistemnogo-programmista]
#   — ГОСТ 19.503-79, п. 1.2, инф. часть
#   Общие сведения о программе; Структура программы; Настройка программы;
#   Проверка программы; Дополнительные возможности;
#   Сообщения системному программисту

# Руководство программиста [rukovodstvo-programmista] — ГОСТ 19.504-79,
#   п. 1.2, инф. часть
#   Назначение и условия применения программ; Характеристика программы;
#   Обращение к программе; Входные и выходные данные; Сообщения

# Руководство оператора [rukovodstvo-operatora] — ГОСТ 19.505-79, п. 1.2,
#   инф. часть
#   Назначение программы; Условия выполнения программы;
#   Выполнение программы; Сообщения оператору

# Описание языка [opisanie-yazyka] — ГОСТ 19.506-79, п. 1.2, инф. часть
#   Общие сведения; Элементы языка

# Ведомость эксплуатационных документов
#   [vedomost-ekspluatatsionnyh-dokumentov] — ГОСТ 19.507-79, п. 3
#   Документы на программу; Документы на составные части программы

# Руководство пользователя [rukovodstvo-polzovatelya] — ГОСТ Р 59795-2021,
#   п. 6.4, инф. часть  (вид по умолчанию)
#   Введение; Назначение и условия применения; Подготовка к работе;
#   Описание операций; Аварийные ситуации; Рекомендации по освоению

# Описание программного обеспечения [opisanie-po] — ГОСТ Р 59795-2021,
#   п. 9.1, инф. часть
#   разделы стандартом не нормируются

# --- Структура тела файла (независимо от вида) ---
#   # H1        — наименование ПО (выводится только на титул)
#   ## H2       — разделы/подразделы (нумеруются автоматически)
#   аннотация   — только из ключа gost_annotation
#   содержание  — строится автоматически (2-pass, номера страниц)
#   ЛИ          — лист регистрации изменений строится в конце автоматически
#                 из docs/release-notes.md (версия/дата/автор/описание)
