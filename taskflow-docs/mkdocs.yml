site_name: TaskFlow — документация
site_description: Система управления задачами и проектами
site_author: "[Кудряшова Т.В.]"
site_url: "https://ifrit181.github.io/portfolio/"

repo_name: "ifrit181/portfolio"
repo_url: "https://github.com/ifrit181/portfolio"

theme:
  name: material
  language: ru
  custom_dir: overrides
  logo: assets/logo/cannabis-leaf_128x128.svg
  favicon: assets/logo/cannabis-leaf_128x128.svg
  palette:
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    #- navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/download-pdf.js

markdown_extensions:
  - pymdownx.snippets:
      base_path: !relative $config_dir/docs/snippets
      check_paths: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
  - tags
  - glightbox
  - git-revision-date-localized:
      type: datetime
      enabled: !ENV [CI, false]
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - swagger-ui-tag:
      docExpansion: none
      filter: ""
      tryItOutEnabled: true

hooks:
  - hooks/generate_pdf.py
  - hooks/portfolio_notice.py

copyright: "Портфолио · вымышленный контент · © 2026 Кудряшова Т.В."

nav:
  - Главная: index.md
  - Начало работы:
      - Установка: getting-started/installation.md
      - Быстрый старт: getting-started/quick-start.md
      - Интерфейс: getting-started/interface.md
  - Руководство пользователя:
      - Задачи: user-guide/tasks.md
      - Проекты: user-guide/projects.md
      - Отчёты: user-guide/reports.md
  - Администрирование:
      - Пользователи: admin-guide/users.md
      - Настройки: admin-guide/settings.md
  - API:
      - Обзор: api/reference.md
      - Спецификация: api/openapi.yaml
  - Теги: tags.md
  - Документация в PDF:
      - Скачать в PDF: pdf.md
      - Требования к оформлению: requirements.md
  - FAQ: faq.md
  - Release notes: release-notes.md
  - Глоссарий: glossary.md
