name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: taskflow-docs/requirements.txt

      - name: Install LibreOffice and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-core libreoffice-writer \
            fonts-liberation fonts-dejavu \
            fonts-crosextra-caladea fonts-crosextra-carlito
          sudo mkdir -p /opt/lo-profile /opt/lo-work
          sudo chmod 777 /opt/lo-profile /opt/lo-work

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r taskflow-docs/requirements.txt

      - name: Lint Markdown
        run: |
          npm install -g markdownlint-cli
          markdownlint taskflow-docs/docs/ \
            --config taskflow-docs/.markdownlint.json || true

      - name: Build site with PDFs
        env:
          LO_PROFILE: /opt/lo-profile
          LO_WORK: /opt/lo-work
        run: mkdocs build -f taskflow-docs/mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: taskflow-docs/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
